<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex, nofollow"/>
<meta name="theme-color" content="#0A0A0C"/>
<title>Owner Panel | Mar Me Yullong Farmstay</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="admin.css"/>
<script src="admin.js" defer></script>
</head>
<body>

<!-- ========================= LOGIN ========================= -->
<main id="login-view" class="login-view" hidden>
  <div class="login-card">
    <div class="brand">Mar Me <span>Yullong</span></div>
    <p class="brand-sub">Owner Panel</p>
    <form id="login-form" novalidate>
      <label for="password">Password</label>
      <div class="pw-row">
        <input id="password" type="password" autocomplete="current-password" placeholder="Enter your password"/>
        <button type="button" id="pw-toggle" class="pw-toggle" aria-label="Show password">Show</button>
      </div>
      <p id="login-error" class="form-error" role="alert" hidden></p>
      <button type="submit" id="login-btn" class="btn btn-gold btn-block">Log in</button>
    </form>
    <p class="login-note">This page is for the farmstay owner only.</p>
  </div>
</main>

<!-- ========================= APP ========================= -->
<div id="app-view" hidden>
  <header class="topbar">
    <div class="brand small">Mar Me <span>Yullong</span><em>Owner Panel</em></div>
    <div class="topbar-right">
      <a class="site-link" href="/" target="_blank" rel="noopener">View website ↗</a>
      <button type="button" id="logout-btn" class="btn btn-ghost btn-sm">Log out</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections">
    <button type="button" class="tab active" role="tab" data-tab="overview" aria-selected="true">Overview</button>
    <button type="button" class="tab" role="tab" data-tab="requests" aria-selected="false">New requests <span class="badge" id="badge-requests" hidden>0</span></button>
    <button type="button" class="tab" role="tab" data-tab="bookings" aria-selected="false">Bookings</button>
    <button type="button" class="tab" role="tab" data-tab="calendar" aria-selected="false">Calendar</button>
  </nav>

  <div class="quickbar">
    <button type="button" id="add-booking-btn" class="btn btn-gold">＋ Add a booking</button>
    <button type="button" id="block-btn" class="btn btn-ghost">⛔ Block dates</button>
  </div>

  <main class="content" id="content">
    <section id="tab-overview" class="tab-panel" role="tabpanel"></section>
    <section id="tab-requests" class="tab-panel" role="tabpanel" hidden></section>
    <section id="tab-bookings" class="tab-panel" role="tabpanel" hidden></section>
    <section id="tab-calendar" class="tab-panel" role="tabpanel" hidden></section>
  </main>
</div>

<!-- ========================= POP-UP ========================= -->
<dialog id="dlg" aria-labelledby="dlg-title">
  <div class="dlg-card">
    <h2 id="dlg-title"></h2>
    <div id="dlg-body"></div>
    <p id="dlg-error" class="form-error" role="alert" hidden></p>
    <div id="dlg-actions" class="dlg-actions"></div>
  </div>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

</body>
</html>
